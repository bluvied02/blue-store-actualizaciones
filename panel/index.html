<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del negocio</title>
<meta name="description" content="Las sucursales en vivo: ventas, cierres, faltantes, pedidos, productos y promos.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="icon" href="icono-192.png">
<style>
  /* EL PANEL DEL NEGOCIO
     Se usa con una mano en el celular (de noche, en el mostrador, desde la
     cama) y con el mouse en la compu de la casa. Fondo oscuro por defecto,
     numeros grandes, y cada cosa a dos toques. */
  :root {
    --fondo: #0b1220; --panel: #121c30; --panel2: #18243c; --borde: #22314f; --linea: rgba(255,255,255,.06);
    --texto: #eaf0fb; --texto2: #a5b4cf; --texto3: #7385a6;
    --verde: #34d399; --ambar: #fbbf24; --rojo: #f87171; --azul: #60a5fa; --azul-fondo: rgba(96,165,250,.14);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radio: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --fondo: #f4f6fb; --panel: #fff; --panel2: #f0f4fb; --borde: #dde5f2; --linea: rgba(16,25,43,.07);
      --texto: #10192b; --texto2: #445271; --texto3: #6b7a96;
      --verde: #0b7a45; --ambar: #8a5508; --rojo: #c81430; --azul: #2563eb; --azul-fondo: rgba(37,99,235,.1);
    }
  }
  :root[data-theme="dark"] {
    --fondo: #0b1220; --panel: #121c30; --panel2: #18243c; --borde: #22314f; --linea: rgba(255,255,255,.06);
    --texto: #eaf0fb; --texto2: #a5b4cf; --texto3: #7385a6;
    --verde: #34d399; --ambar: #fbbf24; --rojo: #f87171; --azul: #60a5fa; --azul-fondo: rgba(96,165,250,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--azul); }

  /* armazon: menu al costado en la compu, abajo en el celular */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .lado { border-right: 1px solid var(--borde); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--panel); }
  .lado .marca { font-weight: 800; font-size: 17px; padding: 4px 10px 16px; }
  .lado button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--texto2); font-weight: 600; }
  .lado button:hover { background: var(--panel2); color: var(--texto); }
  .lado button.activo { background: var(--azul-fondo); color: var(--azul); }
  .lado .insignia { margin-left: auto; }
  .lado .pie-lado { margin-top: 18px; padding: 10px; font-size: 12px; color: var(--texto3); border-top: 1px solid var(--borde); }
  main { padding: 20px 26px 40px; max-width: 1180px; width: 100%; }
  .abajo { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .lado { display: none; }
    main { padding: max(12px, env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom)); }
    .abajo { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: var(--panel); border-top: 1px solid var(--borde); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
    .abajo button { background: none; border: 0; color: var(--texto3); font-size: 11px; font-weight: 600; padding: 6px 2px; display: grid; justify-items: center; gap: 2px; cursor: pointer; position: relative; }
    .abajo button .ic { font-size: 19px; line-height: 1; }
    .abajo button.activo { color: var(--azul); }
    .abajo .insignia { position: absolute; top: 2px; right: 22%; }
  }

  /* piezas */
  .cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--texto3); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .sub { font-size: 12.5px; color: var(--texto3); }
  .tenue { color: var(--texto2); }
  .chico { font-size: 12.5px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px; margin-bottom: 12px; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .grilla > .caja { margin-bottom: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 14px; }
  .tile .r { font-size: 11px; color: var(--texto3); text-transform: uppercase; letter-spacing: .07em; }
  .tile .v { font-size: 24px; font-weight: 750; margin: 2px 0; }
  .tile .d { font-size: 12.5px; color: var(--texto2); }
  .tile.grande { background: linear-gradient(160deg, var(--panel2), var(--panel)); }
  .tile.grande .v { font-size: 32px; }
  .delta { font-size: 12.5px; font-weight: 700; }
  .delta.sube { color: var(--verde); } .delta.baja { color: var(--rojo); } .delta.igual { color: var(--texto3); }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; }
  .fila + .fila { border-top: 1px solid var(--linea); }
  .fila .izq { min-width: 0; }
  .fila .izq b { display: block; overflow: hidden; text-overflow: ellipsis; }
  .fila .der { text-align: right; white-space: nowrap; }
  .mini { background: var(--panel2); border-radius: 12px; padding: 10px 12px; }
  .mini .r { font-size: 11px; color: var(--texto3); text-transform: uppercase; letter-spacing: .06em; }
  .mini .v { font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 2px; }
  .cuatro { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--borde); color: var(--texto2); white-space: nowrap; }
  .chip.ok { color: var(--verde); border-color: color-mix(in srgb, var(--verde) 45%, transparent); }
  .chip.mal { color: var(--rojo); border-color: color-mix(in srgb, var(--rojo) 45%, transparent); }
  .chip.alerta { color: var(--ambar); border-color: color-mix(in srgb, var(--ambar) 45%, transparent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .insignia { background: var(--rojo); color: #fff; border-radius: 999px; font-size: 10.5px; font-weight: 800; padding: 1px 6px; min-width: 18px; text-align: center; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { background: none; border: 0; padding: 7px 12px; border-radius: 9px; cursor: pointer; color: var(--texto2); font-weight: 600; font-size: 13.5px; }
  .seg button.activo { background: var(--azul); color: #fff; }
  :root:not([data-theme="dark"]) .seg button.activo { color: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel2); border: 1px solid var(--borde); border-radius: 11px; padding: 9px 14px; cursor: pointer; font-weight: 650; }
  .btn:hover { border-color: var(--azul); }
  .btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn.peligro { color: var(--rojo); }
  .btn.chico { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
  .btn.ancho { width: 100%; }
  .btn[disabled] { opacity: .5; cursor: default; }
  input[type=text], input[type=search], input[type=email], input[type=password], input[type=number], select, textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--borde); border-radius: 11px; padding: 10px 12px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--azul); }
  label.campo { display: grid; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--texto2); }
  .barra-busqueda { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .barra-busqueda input { flex: 1; min-width: 180px; }
  .nada { text-align: center; color: var(--texto3); padding: 26px 10px; }
  .cargando { opacity: .55; transition: opacity .2s; }
  .aviso-caja { border: 1px solid var(--borde); background: var(--panel2); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; }
  .aviso-caja.alerta { border-color: color-mix(in srgb, var(--ambar) 45%, transparent); }
  .aviso-caja.mal { border-color: color-mix(in srgb, var(--rojo) 45%, transparent); }

  /* barras (una sola serie, un solo color) */
  .barras { display: flex; align-items: flex-end; gap: 2px; height: 120px; margin-top: 8px; }
  .barras .b { flex: 1; background: var(--azul); border-radius: 3px 3px 0 0; min-height: 0; position: relative; cursor: default; }
  .barras .b.vacia { background: transparent; }
  .barras .b:hover { opacity: .8; }
  .eje { display: flex; gap: 2px; font-size: 10.5px; color: var(--texto3); margin-top: 3px; }
  .eje span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }
  .tooltip { position: fixed; z-index: 50; background: var(--texto); color: var(--fondo); font-size: 12.5px; font-weight: 600; padding: 5px 9px; border-radius: 8px; pointer-events: none; display: none; white-space: nowrap; }

  /* tabla simple */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--texto3); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  th.num, td.num { text-align: right; }
  .scroll-x { overflow-x: auto; }

  /* hoja que sube (editar producto, promo...) */
  .telon { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .hoja { background: var(--panel); border: 1px solid var(--borde); border-radius: 18px 18px 0 0; width: min(560px, 100%); max-height: 92vh; overflow: auto; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 821px) { .telon { align-items: center; } .hoja { border-radius: 18px; } }
  .hoja .titulo-hoja { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hoja .titulo-hoja h2 { margin: 0; }
  .hoja .cerrar { background: none; border: 0; font-size: 22px; color: var(--texto3); cursor: pointer; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acciones { display: flex; gap: 8px; margin-top: 12px; }
  .acciones .btn { flex: 1; }

  /* entrar */
  .entrar { max-width: 360px; margin: 14vh auto 0; padding: 0 16px; }
  .entrar h1 { font-size: 26px; margin-bottom: 4px; }
  .entrar p { color: var(--texto2); margin: 0 0 18px; }
  .error { color: var(--rojo); font-size: 13.5px; min-height: 20px; margin: 6px 0; }

  .aviso-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 60; background: var(--texto); color: var(--fondo); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  @media (min-width: 821px) { .aviso-toast { bottom: 26px; } }
  .estado-orden { font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
