<style>
:root {
  --fondo: #eef1f6; --tarjeta: #ffffff; --texto: #141a26; --tenue: #5e6878; --borde: #e2e6ee;
  --azul: #0b4fd6; --azul-osc: #083a9e; --azul-claro: #e7efff; --acento: #ffd60a; --acento-texto: #141a26;
  --oferta: #e0262f; --ok: #11845b; --whatsapp: #1f9d55; --sombra: 0 1px 2px rgba(16,24,40,.06), 0 2px 8px rgba(16,24,40,.06);
  --radio: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: 130px; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 96px; }
button { font: inherit; color: inherit; cursor: pointer; }
img { display: block; }
.oculto { display: none !important; }
.ancho { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* Barra de arriba */
.cab { position: sticky; top: 0; z-index: 20; background: var(--azul); color: #fff; box-shadow: 0 2px 10px rgba(11,79,214,.25); }
.cab .ancho { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 10px; padding-bottom: 10px; }
.marca { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--acento); color: var(--azul-osc); display: grid; place-items: center; font-weight: 900; font-size: 17px; flex: none; }
.logo.con-img { width: 46px; height: 46px; border-radius: 50%; background: #fff; padding: 1px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.logo.con-img img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }
.marca h1 { font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.marca .suc { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carrito-btn { position: relative; border: 0; background: rgba(255,255,255,.14); border-radius: 12px; width: 44px; height: 44px; display: grid; place-items: center; color: #fff; flex: none; }
.carrito-btn svg { width: 24px; height: 24px; }
.carrito-btn b { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--acento); color: var(--acento-texto); font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
.buscador { flex-basis: 100%; position: relative; order: 3; }
.buscador input { width: 100%; border: 0; border-radius: 12px; padding: 12px 14px 12px 42px; font: inherit; font-size: 16px; background: #fff; color: var(--texto); box-shadow: var(--sombra); }
.buscador svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--tenue); }
.franja { background: var(--azul-osc); color: #fff; font-size: 13px; }
.carrito-btn b[hidden] { display: none; }
.cab .franja .ancho { flex-wrap: nowrap; }
.franja .ancho { display: flex; gap: 14px; overflow-x: auto; white-space: nowrap; padding-top: 7px; padding-bottom: 7px; scrollbar-width: none; }
.franja .ancho::-webkit-scrollbar { display: none; }
.franja span { display: inline-flex; gap: 5px; align-items: center; }
.franja .estado { font-weight: 800; padding: 1px 8px; border-radius: 99px; background: rgba(255,255,255,.16); }
.franja .estado.abierto::before, .franja .estado.cerrado::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #40c057; }
.franja .estado.cerrado::before { background: #ff6b6b; }
/* Mientras carga: tarjetas grises que laten. */
.esqueleto { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.esqueleto .banner-e { grid-column: 1 / -1; height: 160px; }
.esqueleto div { height: 230px; border-radius: var(--radio); background: linear-gradient(90deg, #e6eaf2 25%, #f3f5fa 50%, #e6eaf2 75%); background-size: 200% 100%; animation: latido 1.2s infinite linear; }
@keyframes latido { from { background-position: 200% 0 } to { background-position: -200% 0 } }
@media (min-width: 760px) { .buscador { flex-basis: auto; flex: 2; order: 0; } .marca { flex: 1; } }

/* Banner */
.banner { margin-top: 14px; position: relative; }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; scrollbar-width: none; border-radius: var(--radio); }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; border-radius: var(--radio); min-height: 160px; padding: 18px; display: flex; align-items: center; gap: 14px; color: #fff; border: 0; text-align: left; background: linear-gradient(120deg, var(--azul-osc), var(--azul) 60%, #3a7bff); overflow: hidden; }
.slide.amarillo { background: linear-gradient(120deg, #ffb703, var(--acento)); color: var(--acento-texto); }
.slide.rojo { background: linear-gradient(120deg, #b3121b, var(--oferta) 60%, #ff5a5f); }
.slide .txt { flex: 1; min-width: 0; }
.slide .tag { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: rgba(255,255,255,.2); padding: 3px 8px; border-radius: 6px; }
.slide.amarillo .tag { background: rgba(0,0,0,.08); }
.slide h2 { margin: 6px 0 4px; font-size: 24px; line-height: 1.1; letter-spacing: -.02em; }
.slide p { margin: 0; font-size: 14px; opacity: .92; }
.slide .grande { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
.slide img { width: 120px; height: 120px; object-fit: contain; background: #fff; border-radius: 14px; flex: none; padding: 6px; }
.puntitos { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
.puntitos i { width: 7px; height: 7px; border-radius: 50%; background: #c5cddc; }
.puntitos i.activo { background: var(--azul); width: 18px; border-radius: 4px; }
@media (min-width: 760px) { .slide { flex-basis: calc(50% - 6px); min-height: 190px; } }

/* Categorias */
.cats { display: flex; gap: 10px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; width: 76px; border: 0; background: none; padding: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--texto); }
.cat .ico { width: 62px; height: 62px; margin: 0 auto 6px; border-radius: 50%; background: var(--tarjeta); box-shadow: var(--sombra); display: grid; place-items: center; font-size: 28px; }
.cat.activa .ico { outline: 3px solid var(--azul); }
.cat span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Secciones */
.seccion { margin-top: 22px; }
.seccion-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.seccion h2 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
.seccion .sub { color: var(--tenue); font-size: 13px; }
.ver-todo { border: 0; background: none; color: var(--azul); font-weight: 700; font-size: 14px; padding: 4px 0; white-space: nowrap; }
.fila-h { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.fila-h > * { flex: 0 0 158px; scroll-snap-align: start; }
@media (min-width: 760px) { .fila-h > * { flex-basis: 180px; } }
.grilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 600px) { .grilla { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grilla { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

/* Tarjeta de producto */
.prod { background: var(--tarjeta); border-radius: var(--radio); box-shadow: var(--sombra); display: flex; flex-direction: column; overflow: hidden; position: relative; min-width: 0; }
.prod .foto { aspect-ratio: 1; background: #fff; display: grid; place-items: center; border: 0; padding: 8px; width: 100%; position: relative; }
.prod .foto img { width: 100%; height: 100%; object-fit: contain; }
.placa { width: 100%; height: 100%; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 8px; font-weight: 700; font-size: 13px; line-height: 1.2; color: #2b3343; overflow: hidden; word-break: break-word; background: linear-gradient(160deg, var(--suave, #eef2ff), #fff 85%); border: 1px solid var(--borde-suave, #e3e8f5); }
.placa em { font-style: normal; font-size: 40px; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(20,30,60,.08); margin-bottom: 8px; }
.placa span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.combo .placa em, .linea .placa em, .slide .placa em { width: 40px; height: 40px; font-size: 24px; margin-bottom: 4px; }
.linea .placa span, .combo .placa span { display: none; }
.combo .placa { background: linear-gradient(135deg, #ffe066, #ffa94d); border: 0; }
.fila-combos .combo .placa em, .ficha-foto .placa em { width: 64px; height: 64px; font-size: 36px; }
.etiquetas { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.etq { font-size: 10px; font-weight: 800; letter-spacing: .03em; padding: 3px 6px; border-radius: 5px; text-transform: uppercase; background: var(--azul); color: #fff; }
.etq.top { background: #ff7a00; }
.etq.nuevo { background: var(--ok); }
.etq.promo { background: var(--oferta); }
.prod .info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.prod .precio { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.prod .antes, .ficha .antes { font-size: 12px; color: var(--tenue); text-decoration: line-through; line-height: 1; margin-bottom: -2px; }
.precio .off { font-size: 13px; font-weight: 700; color: #00a650; margin-left: 6px; letter-spacing: 0; vertical-align: 3px; }
.prod .llega { font-size: 12px; font-weight: 600; color: #00a650; }
.linea .sub s { color: var(--tenue); }
/* Cuadros por categoria */
.cuadros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 760px) { .cuadros { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cuadro { border: 0; border-radius: var(--radio); padding: 12px; min-height: 92px; display: flex; align-items: center; gap: 8px; text-align: left; color: #fff; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 70%, #000)); box-shadow: var(--sombra); overflow: hidden; }
.cuadro .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cuadro b { font-size: 15px; line-height: 1.15; }
.cuadro span { font-size: 12px; font-weight: 700; opacity: .9; }
.cuadro img { width: 64px; height: 64px; object-fit: contain; background: #fff; border-radius: 12px; padding: 4px; flex: none; }
.cuadro em { font-style: normal; font-size: 34px; flex: none; }
.prod .promo-txt { font-size: 12px; font-weight: 700; color: var(--oferta); }
.prod .nom { font-size: 13px; color: #2b3343; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
.prod .poco { font-size: 11px; color: #9a5b13; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.prod .poco::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #f59f00; flex: none; }
.prod .acciones { margin-top: auto; padding-top: 6px; }
.prod.agotado .foto { opacity: .45; }
.agregar { width: 100%; border: 0; border-radius: 10px; padding: 9px 8px; background: var(--azul); color: #fff; font-weight: 700; font-size: 14px; }
.agregar:active { transform: scale(.98); }
.paso { display: flex; align-items: center; justify-content: space-between; background: var(--azul-claro); border-radius: 10px; padding: 3px; }
.paso button { width: 34px; height: 34px; border: 0; border-radius: 8px; background: #fff; color: var(--azul); font-size: 20px; font-weight: 700; line-height: 1; }
.paso b { font-variant-numeric: tabular-nums; color: var(--azul-osc); }
.sin-stock { text-align: center; font-size: 13px; color: var(--tenue); padding: 9px 0; }

/* Combos */
.combo { background: var(--tarjeta); border-radius: var(--radio); box-shadow: var(--sombra); display: flex; gap: 12px; padding: 12px; align-items: center; border: 2px solid transparent; position: relative; }
.combo.destacado { border-color: var(--acento); }
.combo .foto { width: 96px; height: 96px; flex: none; border-radius: 12px; background: #fff; display: grid; place-items: center; overflow: hidden; border: 0; padding: 0; }
.combo .foto img { width: 100%; height: 100%; object-fit: contain; }
/* Combo sin foto propia: las fotos de lo que lleva, encimadas. */
.collage { position: relative; width: 100%; height: 100%; background: #fff; border-radius: inherit; overflow: hidden; }
.collage img, .combo .foto .collage img { position: absolute; width: 64%; height: 64%; object-fit: contain; }
.collage img:nth-child(1) { left: 2%; top: 2%; }
.collage img:nth-child(2) { right: 2%; bottom: 2%; }
.collage.n3 img { width: 54%; height: 54%; }
.collage.n3 img:nth-child(2) { right: 2%; top: 2%; bottom: auto; }
.collage.n3 img:nth-child(3) { left: 23%; bottom: 2%; }
.collage .mas { position: absolute; right: 4px; bottom: 4px; background: var(--azul); color: #fff; font-weight: 800; font-size: 11px; border-radius: 99px; padding: 2px 7px; }
.slide .collage { width: 120px; height: 120px; flex: none; border-radius: 14px; }
.combo .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.combo h3 { margin: 0; font-size: 16px; }
.combo .lleva { font-size: 12px; color: var(--tenue); }
.combo .tachado { color: var(--tenue); text-decoration: line-through; font-size: 13px; }
.combo .precio { font-size: 21px; font-weight: 900; }
.ahorro { display: inline-block; background: #e6f6ee; color: var(--ok); font-weight: 800; font-size: 12px; padding: 3px 7px; border-radius: 6px; }
.combos { display: grid; gap: 10px; }
/* En la portada los combos van en fila, como los productos. */
.fila-combos { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.fila-combos > .combo { flex: 0 0 236px; scroll-snap-align: start; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
.fila-combos > .combo .foto { width: 100%; height: auto; aspect-ratio: 16 / 10; }
.fila-combos > .combo .acciones { margin-top: auto; }
@media (min-width: 760px) { .combos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Repetir / filtros / mensajes */
.repetir { margin-top: 14px; background: var(--tarjeta); border-radius: var(--radio); box-shadow: var(--sombra); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.repetir .txt { flex: 1; min-width: 0; font-size: 14px; }
.repetir .txt b { display: block; }
.repetir .txt span { color: var(--tenue); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--borde); border-radius: 12px; padding: 11px 16px; background: var(--tarjeta); font-weight: 700; }
.btn.azul { background: var(--azul); color: #fff; border-color: var(--azul); }
.btn.amarillo { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
.btn.whatsapp { background: var(--whatsapp); color: #fff; border-color: var(--whatsapp); }
.btn.ancho-total { width: 100%; font-size: 16px; padding: 14px; }
.filtros { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; align-items: center; }
.filtros::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; }
.chip.activo { background: var(--azul); color: #fff; border-color: var(--azul); }
select.chip { appearance: none; padding-right: 13px; }
.mensaje { margin-top: 14px; background: #fff8d6; border: 1px solid #f5e08a; border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.vacio { text-align: center; color: var(--tenue); padding: 40px 10px; }
.aviso { color: var(--tenue); font-size: 12px; text-align: center; margin: 18px 0 0; }
.cargando { text-align: center; padding: 80px 20px; color: var(--tenue); }
.mas-abajo { height: 1px; }
.miga { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px; }
.miga button { border: 0; background: var(--tarjeta); border-radius: 50%; width: 36px; height: 36px; box-shadow: var(--sombra); font-size: 18px; }
.miga h2 { margin: 0; font-size: 20px; }

/* Barra del carrito abajo */
.pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--fondo) 70%, transparent); pointer-events: none; }
.pie button { pointer-events: auto; width: 100%; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 14px; padding: 13px 16px; background: var(--azul); color: #fff; font-size: 16px; font-weight: 700; box-shadow: 0 8px 24px rgba(11,79,214,.35); }
.pie .cuenta { background: rgba(255,255,255,.2); border-radius: 8px; padding: 2px 9px; font-size: 14px; }
.pie .total { margin-left: auto; font-variant-numeric: tabular-nums; }
.pie .falta { display: block; font-size: 12px; font-weight: 600; opacity: .9; text-align: left; }

/* Hojas (ficha, carrito) */
.hoja { position: fixed; inset: 0; background: rgba(10,16,30,.5); z-index: 30; display: none; }
.hoja.abierta { display: block; }
.hoja > .caja { position: absolute; left: 0; right: 0; bottom: 0; max-height: 94vh; overflow: auto; background: var(--fondo); border-radius: 20px 20px 0 0; padding: 0 0 calc(18px + env(safe-area-inset-bottom)); max-width: 680px; margin: 0 auto; animation: subir .2s ease-out; }
@keyframes subir { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (min-width: 760px) { .hoja > .caja { top: 50%; bottom: auto; transform: translateY(-50%); border-radius: 20px; max-height: 90vh; animation: none; } }
.hoja-cab { position: sticky; top: 0; z-index: 2; background: var(--fondo); display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
.hoja-cab h2 { margin: 0; font-size: 19px; }
.cerrar { border: 0; background: var(--tarjeta); width: 38px; height: 38px; border-radius: 50%; font-size: 20px; box-shadow: var(--sombra); }
.hoja-cuerpo { padding: 0 16px; }
.ficha-foto { background: #fff; border-radius: var(--radio); aspect-ratio: 1; max-height: 360px; width: 100%; display: grid; place-items: center; padding: 16px; }
.ficha-foto img { width: 100%; height: 100%; object-fit: contain; }
.ficha h3 { font-size: 20px; margin: 12px 0 2px; }
.ficha .meta { color: var(--tenue); font-size: 13px; }
.ficha .precio { font-size: 30px; font-weight: 900; margin: 6px 0; letter-spacing: -.02em; }
.ficha .promo-caja { background: #fdecec; color: var(--oferta); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; margin: 6px 0; }
.ficha .botones { display: flex; gap: 8px; margin: 12px 0; }
.ficha .botones > * { flex: 1; }
.ficha .paso button { width: 44px; height: 44px; }
.linea { display: flex; gap: 10px; align-items: center; background: var(--tarjeta); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
.linea .mini { width: 52px; height: 52px; flex: none; background: #fff; border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.linea .mini img { width: 100%; height: 100%; object-fit: contain; }
.linea .info { flex: 1; min-width: 0; font-size: 14px; }
.linea .info div:first-child { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.linea .sub { color: var(--tenue); font-size: 12px; }
.linea .paso { flex: none; gap: 4px; }
.barra-envio { background: var(--tarjeta); border-radius: 12px; padding: 10px 12px; margin: 4px 0 12px; font-size: 13px; }
.barra-envio .riel { height: 7px; background: var(--azul-claro); border-radius: 4px; margin-top: 7px; overflow: hidden; }
.barra-envio .riel i { display: block; height: 100%; background: var(--ok); border-radius: 4px; transition: width .3s; }
.cuentas { background: var(--tarjeta); border-radius: 12px; padding: 10px 12px; margin: 12px 0; }
.cuentas div { display: flex; justify-content: space-between; padding: 3px 0; font-size: 14px; }
.cuentas .tot { font-size: 18px; font-weight: 800; border-top: 1px solid var(--borde); margin-top: 5px; padding-top: 8px; }
.campo { margin: 10px 0; }
.campo label { display: block; font-size: 13px; color: var(--tenue); margin-bottom: 4px; font-weight: 600; }
.campo input, .campo textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto); }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 12px; padding: 10px 6px; font-weight: 600; font-size: 14px; }
.seg button.activo { background: var(--azul); color: #fff; border-color: var(--azul); }
.error { color: var(--oferta); font-size: 13px; font-weight: 600; margin: 6px 0; }
.mayor { display: flex; gap: 8px; align-items: center; font-size: 14px; background: #fff8d6; border-radius: 10px; padding: 10px; margin: 10px 0; }
/* Empujones de venta (todos con datos reales) */
.etq.hoy { background: #7048e8; }
.btn.llevar { display: block; width: 100%; margin-top: 10px; background: #fff0f0; color: var(--oferta); border: 1.5px dashed var(--oferta); font-weight: 800; }
.linea .gana { font-size: 12px; font-weight: 700; color: #00a650; }
.empujon { margin-top: 4px; border: 0; background: #fff0f0; color: var(--oferta); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 4px 10px; }
.armar { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #fff9db, #ffec99); border: 1px solid #ffd43b; border-radius: 12px; padding: 10px 12px; margin: 4px 0 12px; }
.armar .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.armar .btn { flex: none; padding: 10px 12px; }
.cuentas .verde { color: #00a650; font-weight: 700; }
.slide.verde { background: linear-gradient(120deg, #087f5b, #12b886 60%, #63e6be); }
.slide .grande-ico { font-style: normal; font-size: 64px; flex: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.2)); }
.slide.marca-slide { background: radial-gradient(circle at 85% 50%, #1c7ed6 0, var(--azul) 35%, #04173f 100%); }
.slide.marca-slide img { width: 128px; height: 128px; border-radius: 50%; padding: 0; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
/* Lo mas buscado (debajo del buscador) */
.sugeridas { background: #fff; color: var(--texto); border-bottom: 1px solid var(--borde); box-shadow: 0 8px 18px rgba(16,24,40,.12); }
.sugeridas .ancho { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
.sugeridas span { font-size: 12px; font-weight: 700; color: var(--tenue); white-space: nowrap; }
.sugeridas .chip { flex: none; }
/* WhatsApp flotante */
.wa-flota { position: fixed; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 14; display: flex; align-items: center; gap: 6px; background: var(--whatsapp); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 99px; padding: 10px 14px; box-shadow: 0 6px 18px rgba(31,157,85,.4); }
.wa-flota svg { width: 22px; height: 22px; }
.wa-flota[hidden] { display: none; }
body.con-pie .wa-flota { bottom: calc(84px + env(safe-area-inset-bottom)); padding: 10px; }
body.con-pie .wa-flota span { display: none; }
body.con-hoja .wa-flota { display: none; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: #141a26; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 40; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header class="cab">
  <div class="ancho">
    <div class="marca"><div class="logo" id="logo">B</div><div style="min-width:0"><h1 id="titulo">Cargando…</h1><div class="suc" id="sucursal"></div></div></div>
    <label class="buscador" id="buscador" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="buscar" placeholder="Buscar golosinas, bebidas, marcas…" autocomplete="off" enterkeyhint="search" aria-label="Buscar productos">
    </label>
    <button class="carrito-btn" id="carritoBtn" aria-label="Ver mi pedido" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
      <b id="carritoCuenta" hidden>0</b>
    </button>
  </div>
  <div class="franja" id="franja" hidden><div class="ancho" id="franjaTxt"></div></div>
  <div class="sugeridas" id="sugeridas" hidden><div class="ancho" id="sugeridasTxt"></div></div>
</header>
<a class="wa-flota" id="waFlota" hidden target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.2-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg><span>Consultas</span></a>
<main class="ancho" id="contenido"><div class="esqueleto" aria-label="Cargando la tienda…"><div class="banner-e"></div><div></div><div></div><div></div><div></div></div></main>
<div class="pie" id="pie" hidden><button id="pieBtn"></button></div>
<div class="hoja" id="hoja"><div class="caja" id="hojaCaja"></div></div>
<script>
'use strict'
// La tienda online (Blue Store YA, 05-11-2026): lee el archivo publico que deja
// la caja de la sucursal (servicios/tienda.js) y arma una tienda de delivery:
// mas vendidos, combos, promos, nuevos y todo el catalogo. El pedido entra
// directo a Encargos (pos_tienda_pedido con la clave publica) o, si no se
// puede, sale por WhatsApp. Lee tambien el archivo viejo (v 1).
//
// Marketing honesto: "mas vendido", "ultimas unidades" y "nuevo" salen de los
// datos reales de la caja; el precio tachado de un combo es la suma real de los
// productos sueltos; el envio se ve desde el carrito.
;(function () {
  const params = new URLSearchParams((location.hash || '').slice(1) || location.search.slice(1))
  const proyecto = String(params.get('p') || '').replace(/[^a-z0-9-]/gi, '')
  const sucursal = String(params.get('s') || '').replace(/[^\w-]/g, '')
  const $ = (id) => document.getElementById(id)
  const el = (tag, props, ...hijos) => {
    const n = document.createElement(tag)
    for (const [k, v] of Object.entries(props || {})) {
      if (k === 'clase') n.className = v
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
      else if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v)
    }
    for (const h of hijos.flat()) if (h != null && h !== false) n.append(h.nodeType ? h : String(h))
    return n
  }
  // replaceChildren escribe "null" si le llega un null: este los saca.
  const poner = (n, ...h) => n.replaceChildren(...h.flat().filter((x) => x != null && x !== false && x !== ''))
  const pesos = (c) => '$ ' + (Math.round(c) / 100).toLocaleString('es-AR', { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 })
  const normal = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  const titulo = (t) => String(t || '').toLowerCase().replace(/(^|[\s(/-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase())
  const CLAVE = 'tienda.' + proyecto + '.' + sucursal
  const leer = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch (e) { return d } }
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { /* sin almacenamiento */ } }
  const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }

  let datos = null
  let productos = []
  const porId = {}
  let combos = []
  let promos = []
  const promoDe = {} // producto -> promo
  const combosDe = {} // producto -> combos donde entra
  let rankDe = {} // producto -> puesto en mas vendidos
  let carrito = leer(CLAVE + '.carrito', null) || {}
  const cliente = leer(CLAVE + '.cliente', { nombre: '', telefono: '', entrega: 'retiro', direccion: '', pago: 'efectivo' })
  let vista = { tipo: 'inicio' }
  let enviando = false
  const tarjetasVivas = new Set() // para repintar el +/- de todas las tarjetas a la vez

  // ---------- Categorias: icono y color ----------
  const ICONOS = [
    [/combo/, '🎁', '#f59f00'],
    [/golosin|caramel|chicle|chocolat|alfajor|bombon/, '🍬', '#d6336c'],
    [/galletit|galleta|bizcoch|budin/, '🍪', '#b7791f'],
    [/snack|papas|palito|chizito|mani/, '🍟', '#e8590c'],
    [/cerveza|vino|fernet|aperitiv|whisk|vodka|licor|alcoh|espumant|gin\b/, '🍺', '#a85d00'],
    [/gaseos|bebida|agua|jugo|soda|energiz|isoton/, '🥤', '#1c7ed6'],
    [/lacte|leche|yogur|queso|manteca|crema/, '🥛', '#4c6ef5'],
    [/fiambre|embutid/, '🥓', '#c2255c'],
    [/helad/, '🍦', '#f783ac'],
    [/congelad/, '🧊', '#15aabf'],
    [/panader|pan\b|factura/, '🥐', '#d9480f'],
    [/limpieza|lavand|deterg|lavavaj/, '🧽', '#0ca678'],
    [/perfum|higiene|cosmet|shampoo|jabon|desodor|panal|pañal/, '🧴', '#ae3ec9'],
    [/farmac|botiquin|preservat|analges/, '💊', '#e03131'],
    [/mascota|perro|gato/, '🐾', '#795548'],
    [/libreri|papeler|escolar/, '✏️', '#f08c00'],
    [/bazar|descartab|cocina/, '🍽️', '#495057'],
    [/infusion|yerba|cafe|te\b|mate/, '🧉', '#2b8a3e'],
    [/almacen|fideo|arroz|aceite|harina|conserva|enlatad|azucar|condiment|aderez/, '🥫', '#e67700'],
    [/verdu|fruta/, '🍎', '#2f9e44'],
    [/carne|pollo|carnic/, '🥩', '#c92a2a'],
    [/pila|electr|cargador|regalo|juguet/, '🔋', '#5f3dc4'],
    [/recarga|carga virtual|sube/, '📱', '#1971c2']
  ]
  const estilos = {}
  const estiloCat = (c) => {
    if (estilos[c]) return estilos[c]
    const n = normal(c)
    const f = ICONOS.find(([re]) => re.test(n))
    return (estilos[c] = f ? { ico: f[1], color: f[2] } : { ico: '🛒', color: '#3b5bdb' })
  }
  const esAlcohol = (p) => /cerveza|vino|fernet|aperitiv|whisk|vodka|licor|alcoh|espumant|\bgin\b|ron\b|champa/.test(normal(p.categoria + ' ' + p.subrubro + ' ' + p.nombre))

  // ---------- Carga ----------
  const fallar = (texto) => {
    $('titulo').textContent = 'Tienda'
    $('contenido').replaceChildren(el('div', { clase: 'vacio' }, texto))
  }

  async function cargar () {
    if (!proyecto || !sucursal) return fallar('El link está incompleto. Pedile al local que te lo mande de nuevo.')
    try {
      // En la compu de prueba (localhost) se puede leer un archivo de ejemplo.
      const ejemplo = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && params.get('datos')
      const r = ejemplo ? await fetch(ejemplo) : await fetch('https://' + proyecto + '.supabase.co/storage/v1/object/public/panel/tienda/' + sucursal + '.json?t=' + Math.floor(Date.now() / 120000), { cache: 'no-store' })
      // 400/404 = la caja todavía no publicó la tienda (o la apagó): no es la conexión del cliente.
      if (r.status === 400 || r.status === 404) return fallar('Esta tienda todavía no está abierta. Probá más tarde.')
      if (!r.ok) throw new Error('no hay')
      datos = await r.json()
    } catch (e) { return fallar('No se pudo abrir la tienda. Revisá la conexión y probá de nuevo.') }
    if (!datos || datos.apagada || !Array.isArray(datos.productos)) return fallar('Esta tienda no está disponible por ahora.')
    preparar()
    pintarCabecera()
    limpiarCarrito()
    abrirDelLink()
    pintar()
    pintarPie()
  }

  function preparar () {
    productos = datos.productos.map((p, i) => ({
      i, nombre: p[0], precio: p[1], categoria: p[2] || 'Otros', foto: p[3] || '', hay: !!p[4], id: String(p[5] || 'n:' + p[0]),
      marca: p[6] || '', nuevo: !!p[7], poco: !!p[8], subrubro: p[9] || ''
    }))
    for (const p of productos) {
      porId[p.id] = p
      p.busca = normal([p.nombre, p.marca, p.categoria, p.subrubro].join(' '))
    }
    combos = (datos.combos || []).filter((c) => c && c.precio > 0)
    promos = datos.promos || []
    for (const pr of promos) for (const id of pr.ids || []) if (!promoDe[id]) promoDe[id] = pr
    for (const c of combos) for (const parte of c.partes || []) for (const id of parte.ids || []) (combosDe[id] = combosDe[id] || []).includes(c) || combosDe[id].push(c)
    rankDe = {}
    ;(datos.masVendidos || []).forEach((id, i) => { if (porId[id]) rankDe[id] = i + 1 })
  }

  const t = () => datos.tienda || {}
  const nombreTienda = () => t().nombre || datos.negocio || 'Tienda'

  // "Todos los dias de 8 a 24 h" -> abierto o cerrado ahora. Si el horario nombra
  // dias sueltos ("lun a sab") no se adivina: mejor no decir nada que mentir.
  // "SUCURSAL ALBERDI 487" -> "Alberdi 487".
  const nombreSucursal = () => titulo(String(datos.sucursal || '').replace(/^\s*sucursal\s*/i, ''))

  function abiertoAhora (h) {
    const n = normal(h || '')
    if (!n || /lun|mart|mar\b|mier|jue|vie|sab|dom|feriad/.test(n.replace(/todos los dias/, ''))) return null
    const m = n.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(?:h|hs)?\s*a\s*(\d{1,2})(?:[:.](\d{2}))?/)
    if (!m) return null
    const desde = Number(m[1]) * 60 + Number(m[2] || 0)
    let hasta = Number(m[3]) * 60 + Number(m[4] || 0)
    if (desde > 24 * 60 || hasta > 24 * 60) return null
    if (desde === 0 && hasta === 24 * 60) return { abierto: true }
    const d = new Date()
    const ahora = d.getHours() * 60 + d.getMinutes()
    const abierto = hasta > desde ? ahora >= desde && ahora < hasta : ahora >= desde || ahora < hasta
    return { abierto, abre: m[1] + (m[2] && m[2] !== '00' ? ':' + m[2] : '') }
  }

  function pintarCabecera () {
    const nombre = nombreTienda()
    document.title = nombre + (datos.sucursal ? ' · ' + datos.sucursal : '')
    $('titulo').textContent = nombre
    // El logo de la marca (el mismo icono del panel); si no carga, la inicial.
    const ini = (nombre.match(/\p{L}/u) || ['B'])[0].toUpperCase()
    const img = el('img', { src: 'icono-192.png', alt: nombre })
    img.addEventListener('error', () => { $('logo').classList.remove('con-img'); $('logo').textContent = ini }, { once: true })
    $('logo').classList.add('con-img')
    $('logo').replaceChildren(img)
    // La direccion ya suele traer el nombre de la sucursal: no repetirlo.
    const dir = datos.direccion || ''
    const suc = datos.sucursal && !normal(dir).includes(normal(nombreSucursal())) ? nombreSucursal() : ''
    $('sucursal').textContent = dir ? '📍 ' + [suc, titulo(dir)].filter(Boolean).join(' · ') : titulo(datos.sucursal || '')
    $('buscador').hidden = false
    $('carritoBtn').hidden = false
    const franja = []
    const ab = abiertoAhora(t().horario)
    if (ab) franja.push(el('span', { clase: 'estado ' + (ab.abierto ? 'abierto' : 'cerrado') }, ab.abierto ? 'Abierto ahora' : 'Cerrado' + (ab.abre != null ? ' · abre a las ' + ab.abre : '')))
    if (t().demora) franja.push(el('span', {}, '⚡ Llega en ~' + t().demora + ' min'))
    if (t().horario) franja.push(el('span', {}, '🕒 ' + t().horario))
    if (t().envioGratis) franja.push(el('span', {}, '🚚 Envío gratis desde ' + pesos(t().envioGratis)))
    else if (t().envioCosto) franja.push(el('span', {}, '🚚 Envío ' + pesos(t().envioCosto)))
    if (t().envioMinimo) franja.push(el('span', {}, 'Mínimo para envío ' + pesos(t().envioMinimo)))
    if (datos.puntos) franja.push(el('span', {}, '⭐ Sumás puntos con tu teléfono'))
    if (datos.whatsapp) {
      $('waFlota').href = 'https://wa.me/' + datos.whatsapp + '?text=' + encodeURIComponent('Hola! Tengo una consulta sobre la tienda online')
      $('waFlota').hidden = false
    }
    $('franja').hidden = !franja.length
    $('franjaTxt').replaceChildren(...franja)
  }

  // Lo guardado de otra visita: solo lo que sigue estando. El carrito viejo
  // (antes del 05-11) estaba por nombre: se pasa al id.
  function limpiarCarrito () {
    const viejo = leer(CLAVE + '.pedido', null)
    if (viejo && !Object.keys(carrito).length) for (const [n, c] of Object.entries(viejo)) { const p = productos.find((x) => x.nombre === n); if (p) carrito[p.id] = c }
    const limpio = {}
    for (const [k, c] of Object.entries(carrito)) if (c > 0 && disponible(k)) limpio[k] = Math.min(99, c)
    carrito = limpio
    guardar(CLAVE + '.carrito', carrito)
  }
  const comboDe = (k) => k.startsWith('combo:') ? combos.find((c) => c.id === k.slice(6)) : null
  const disponible = (k) => k.startsWith('combo:') ? !!comboDe(k) : !!(porId[k] && porId[k].hay)

  // Link compartido de un producto o un combo: lo abre directo.
  function abrirDelLink () {
    const prod = params.get('prod')
    const combo = params.get('combo')
    if (prod && porId[prod]) setTimeout(() => abrirFicha(porId[prod]), 50)
    else if (combo) { const c = combos.find((x) => x.id === combo); if (c) setTimeout(() => abrirCombo(c), 50) }
  }

  // Precio con la promo, cuando es por unidad y sin horario ("20% OFF",
  // "$ 600 menos c/u", "a $ 3.900 c/u"). Los 6x5 y los de horario quedan como
  // etiqueta: esos los calcula la caja al cobrar.
  const pesosDe = (tx) => Math.round(Number(String(tx).replace(/\./g, '').replace(',', '.')) * 100)
  function conPromo (p) {
    const pr = promoDe[p.id]
    if (!pr || pr.horas) return null
    const e = pr.etiqueta || ''
    let fin = 0
    let m = e.match(/^(\d+(?:,\d+)?)% OFF$/)
    if (m) fin = Math.round(p.precio * (1 - Number(m[1].replace(',', '.')) / 100))
    else if ((m = e.match(/^\$ ?([\d.,]+) menos c\/u$/))) fin = p.precio - pesosDe(m[1])
    else if ((m = e.match(/^a \$ ?([\d.,]+) c\/u$/))) fin = pesosDe(m[1])
    if (!(fin > 0 && fin < p.precio)) return null
    return { precio: fin, antes: p.precio, off: Math.round((1 - fin / p.precio) * 100) }
  }
  const precioDe = (p) => (conPromo(p) || p).precio
  // "6x5": llevando 6 pagas 5. Lo cobra la caja; aca se muestra cuanto sale c/u.
  function nxmDe (p) {
    const pr = promoDe[p.id]
    const m = pr && !pr.horas && String(pr.etiqueta || '').match(/^(\d+)x(\d+)$/)
    if (!m) return null
    const lleva = Number(m[1])
    const paga = Number(m[2])
    if (!(lleva > paga && paga > 0 && lleva <= 24)) return null
    return { lleva, paga, unidad: Math.round(p.precio * paga / lleva) }
  }
  function textoPromo (p) {
    const pr = promoDe[p.id]
    if (!pr || conPromo(p)) return null
    const n = nxmDe(p)
    return el('div', { clase: 'promo-txt' }, n ? pr.etiqueta + ' · llevando ' + n.lleva + ', ' + pesos(n.unidad) + ' c/u' : pr.etiqueta)
  }
  function bloquePrecio (p) {
    const cp = conPromo(p)
    if (!cp) return [el('div', { clase: 'precio' }, pesos(p.precio))]
    return [el('div', { clase: 'antes' }, pesos(cp.antes)),
      el('div', { clase: 'precio' }, pesos(cp.precio), cp.off >= 1 ? el('span', { clase: 'off' }, cp.off + '% OFF') : null)]
  }
  // Lo que vio y lo que compro antes (en este celular), para "Visto" y "Volvé a comprar".
  function anotar (clave, ids, tope) {
    const l = leer(CLAVE + clave, [])
    const nueva = [...ids, ...l.filter((x) => !ids.includes(x))].slice(0, tope)
    guardar(CLAVE + clave, nueva)
  }

  // ---------- Carrito ----------
  const cuantos = (k) => carrito[k] || 0
  function cambiar (k, d) {
    const antes = cuantos(k)
    if (d > 0 && !antes && Object.keys(carrito).length >= 40) return toast('Llegaste al máximo de 40 productos distintos por pedido.')
    const n = Math.max(0, Math.min(99, antes + d))
    if (n) carrito[k] = n
    else delete carrito[k]
    guardar(CLAVE + '.carrito', carrito)
    for (const f of [...tarjetasVivas]) { if (!f.nodo.isConnected) tarjetasVivas.delete(f); else if (f.k === k) f.pintar() }
    pintarPie()
    if (!antes && n) toast('Agregado a tu pedido')
  }
  const lineas = () => Object.entries(carrito).map(([k, c]) => {
    const combo = comboDe(k)
    if (combo) return { k, c, nombre: combo.nombre, precio: combo.precio, foto: combo.foto, combo }
    const p = porId[k]
    return p ? { k, c, nombre: p.nombre, precio: precioDe(p), lista: p.precio, foto: p.foto, p } : null
  }).filter(Boolean)
  // Lo que descuenta un 6x5 en esa linea (por producto: si la promo mezcla, la
  // caja descuenta igual o mas). Va al total aproximado.
  const ahorroLinea = (x) => { const n = x.p && nxmDe(x.p); return n ? Math.floor(x.c / n.lleva) * (n.lleva - n.paga) * x.p.precio : 0 }
  const bruto = () => lineas().reduce((s, x) => s + x.precio * x.c, 0)
  const ahorroPromos = () => lineas().reduce((s, x) => s + ahorroLinea(x), 0)
  const subtotal = () => bruto() - ahorroPromos()
  const unidades = () => lineas().reduce((s, x) => s + x.c, 0)
  const costoEnvio = (sub) => t().envioGratis && sub >= t().envioGratis ? 0 : (t().envioCosto || 0)

  function pintarPie () {
    const u = unidades()
    $('carritoCuenta').hidden = !u
    $('carritoCuenta').textContent = u
    $('pie').hidden = !u || $('hoja').classList.contains('abierta')
    document.body.classList.toggle('con-pie', !$('pie').hidden)
    if (!u) return
    const sub = subtotal()
    const falta = t().envioGratis && sub < t().envioGratis ? t().envioGratis - sub : 0
    $('pieBtn').replaceChildren(
      el('span', { clase: 'cuenta' }, u),
      el('span', {}, 'Ver mi pedido', falta ? el('span', { clase: 'falta' }, 'Te faltan ' + pesos(falta) + ' para envío gratis') : null),
      el('span', { clase: 'total' }, pesos(sub)))
  }

  function paso (k, grande) {
    return el('div', { clase: 'paso' },
      el('button', { 'aria-label': 'Uno menos', onclick: (ev) => { ev.stopPropagation(); cambiar(k, -1) } }, '−'),
      el('b', {}, cuantos(k) + (grande ? ' en tu pedido' : '')),
      el('button', { 'aria-label': 'Uno más', onclick: (ev) => { ev.stopPropagation(); cambiar(k, 1) } }, '+'))
  }
  // El boton Agregar / − n + que se repinta solo cuando cambia ese producto.
  function control (k, hay, grande) {
    const nodo = el('div', { clase: 'acciones' })
    const f = { k, nodo, pintar: () => nodo.replaceChildren(!hay ? el('div', { clase: 'sin-stock' }, 'Sin stock') : cuantos(k) ? paso(k, grande) : el('button', { clase: 'agregar', onclick: (ev) => { ev.stopPropagation(); cambiar(k, 1) } }, '+ Agregar')) }
    f.pintar()
    tarjetasVivas.add(f)
    return nodo
  }

  // ---------- Tarjetas ----------
  function placa (nombre, categoria) {
    const e = estiloCat(categoria)
    return el('div', { clase: 'placa', style: '--suave:' + e.color + '1f;--borde-suave:' + e.color + '33' }, el('em', {}, e.ico), el('span', {}, titulo(nombre)))
  }
  function foto (p) {
    if (!p.foto) return placa(p.nombre, p.categoria)
    const img = el('img', { src: p.foto, alt: '', loading: 'lazy', decoding: 'async' })
    img.addEventListener('error', () => img.replaceWith(placa(p.nombre, p.categoria)), { once: true })
    return img
  }
  // Foto del combo: la que le puso el local; si no, las de lo que lleva (hasta 3).
  function fotoCombo (c) {
    const fotos = []
    for (const x of c.partes || []) {
      const p = (x.ids || []).map((id) => porId[id]).find((q) => q && q.foto)
      if (p && !fotos.includes(p.foto)) fotos.push(p.foto)
    }
    if (c.foto && (c.propia || fotos.length < 2)) return el('img', { src: c.foto, alt: '', loading: 'lazy' })
    if (fotos.length < 2) return placa(c.nombre, 'combo')
    const extra = (c.partes || []).length - Math.min(3, fotos.length)
    return el('div', { clase: 'collage' + (fotos.length >= 3 ? ' n3' : '') },
      fotos.slice(0, 3).map((u) => el('img', { src: u, alt: '', loading: 'lazy', decoding: 'async' })),
      extra > 0 ? el('span', { clase: 'mas' }, '+' + extra) : null)
  }
  function tarjeta (p) {
    const promo = promoDe[p.id]
    const rank = rankDe[p.id]
    const etqs = []
    if (rank && rank <= 10) etqs.push(el('span', { clase: 'etq top' }, rank === 1 ? 'N.º 1 más vendido' : 'Más vendido'))
    if (p.nuevo) etqs.push(el('span', { clase: 'etq nuevo' }, 'Nuevo'))
    const cp = conPromo(p)
    if (promo && !cp) etqs.push(el('span', { clase: 'etq promo' }, promo.etiqueta.length <= 14 ? promo.etiqueta : 'Promo'))
    if (promo && promo.hasta === hoy()) etqs.push(el('span', { clase: 'etq hoy' }, 'Termina hoy'))
    const llega = p.hay && t().demora && datos.pedidos && (abiertoAhora(t().horario) || { abierto: true }).abierto
    return el('article', { clase: 'prod' + (p.hay ? '' : ' agotado') },
      el('button', { clase: 'foto', 'aria-label': 'Ver ' + p.nombre, onclick: () => abrirFicha(p) }, foto(p), etqs.length ? el('div', { clase: 'etiquetas' }, etqs) : null),
      el('div', { clase: 'info' },
        bloquePrecio(p),
        textoPromo(p),
        llega ? el('div', { clase: 'llega' }, 'Llega en ~' + t().demora + ' min') : null,
        el('div', { clase: 'nom', title: p.nombre }, titulo(p.nombre)),
        p.poco ? el('div', { clase: 'poco' }, '¡Últimas unidades!') : null,
        control(p.id, p.hay)))
  }
  function tarjetaCombo (c, destacado) {
    const lleva = (c.partes || []).map((x) => x.n + ' ' + titulo(x.nombre)).join(' + ')
    const ahorro = c.separado ? c.separado - c.precio : 0
    return el('article', { clase: 'combo' + (destacado ? ' destacado' : '') },
      el('button', { clase: 'foto', 'aria-label': 'Ver ' + c.nombre, onclick: () => abrirCombo(c) }, fotoCombo(c)),
      el('div', { clase: 'info' },
        el('h3', {}, titulo(c.nombre)),
        el('div', { clase: 'lleva' }, lleva),
        c.separado ? el('div', { clase: 'tachado' }, 'Por separado ' + pesos(c.separado)) : null,
        el('div', { clase: 'precio' }, pesos(c.precio)),
        ahorro > 0 ? el('div', {}, el('span', { clase: 'ahorro' }, 'Ahorrás ' + pesos(ahorro))) : null,
        c.horas ? el('div', { clase: 'lleva' }, 'De ' + c.horas + ' h') : null,
        control('combo:' + c.id, true)))
  }

  // ---------- Listas ----------
  const conHay = (l) => l.filter((p) => p && p.hay)
  // Solo lo que de verdad se vende (nunca relleno: seria mentirle al cliente).
  const masVendidos = () => conHay((datos.masVendidos || []).map((id) => porId[id]))
  const nuevos = () => conHay(productos.filter((p) => p.nuevo)).sort((a, b) => !!b.foto - !!a.foto)
  const enPromo = () => conHay(productos.filter((p) => promoDe[p.id])).sort((a, b) => (rankDe[a.id] || 999) - (rankDe[b.id] || 999))
  const categorias = () => {
    const cuenta = {}
    for (const p of productos) if (p.hay) cuenta[p.categoria] = (cuenta[p.categoria] || 0) + 1
    // Primero las que mas venden.
    const peso = {}
    for (const id of datos.masVendidos || []) if (porId[id]) peso[porId[id].categoria] = (peso[porId[id].categoria] || 0) + 1
    return Object.keys(cuenta).sort((a, b) => (peso[b] || 0) - (peso[a] || 0) || cuenta[b] - cuenta[a])
  }

  function filaH (lista) { return el('div', { clase: 'fila-h' }, lista.map(tarjeta)) }
  function seccion (titulo1, sub, cuerpo, verTodo) {
    return el('section', { clase: 'seccion' },
      el('div', { clase: 'seccion-cab' }, el('div', {}, el('h2', {}, titulo1), sub ? el('div', { clase: 'sub' }, sub) : null), verTodo ? el('button', { clase: 'ver-todo', onclick: verTodo }, 'Ver todo ›') : null),
      cuerpo)
  }

  // Grilla que se va cargando sola al bajar.
  function grilla (lista) {
    const g = el('div', { clase: 'grilla' })
    const fin = el('div', { clase: 'mas-abajo' })
    let hasta = 0
    const mas = () => { const tramo = lista.slice(hasta, hasta + 40); hasta += tramo.length; g.append(...tramo.map(tarjeta)); if (hasta >= lista.length) obs.disconnect() }
    const obs = new IntersectionObserver((e) => { if (e.some((x) => x.isIntersecting)) mas() }, { rootMargin: '800px' })
    mas()
    setTimeout(() => { if (hasta < lista.length) obs.observe(fin) }, 0)
    return el('div', {}, g, fin)
  }

  // ---------- Pantallas ----------
  function pintar () {
    tarjetasVivas.clear()
    const c = $('contenido')
    if (vista.tipo === 'buscar') return c.replaceChildren(...pantallaBuscar())
    if (vista.tipo === 'lista') return c.replaceChildren(...pantallaLista())
    poner(c, pantallaInicio())
    banners()
  }
  function ir (v) { vista = v; pintar(); window.scrollTo({ top: 0 }) }

  function pantallaInicio () {
    const partes = []
    if (datos.mensaje) partes.push(el('div', { clase: 'mensaje' }, datos.mensaje))
    if (!datos.whatsapp && !datos.pedidos) partes.push(el('div', { clase: 'mensaje' }, 'Esta tienda todavía no recibe pedidos online. Podés mirar los precios.'))
    partes.push(el('div', { clase: 'banner', id: 'banner' }))
    const ult = ultimoPedido()
    if (ult) partes.push(el('div', { clase: 'repetir' }, el('div', { clase: 'txt' }, el('b', {}, '¿Lo de siempre?'), el('span', {}, ult.texto)), el('button', { clase: 'btn amarillo', onclick: repetir }, 'Repetir')))
    const cats = categorias()
    partes.push(el('nav', { clase: 'cats', 'aria-label': 'Categorías' },
      combos.length ? el('button', { clase: 'cat', onclick: () => document.getElementById('sec-combos').scrollIntoView({ behavior: 'smooth' }) }, el('div', { clase: 'ico' }, '🎁'), el('span', {}, 'Combos')) : null,
      enPromo().length ? el('button', { clase: 'cat', onclick: () => ir({ tipo: 'lista', promo: true, titulo: 'Ofertas' }) }, el('div', { clase: 'ico' }, '🔥'), el('span', {}, 'Ofertas')) : null,
      cats.map((k) => el('button', { clase: 'cat', onclick: () => ir({ tipo: 'lista', categoria: k, titulo: titulo(k) }) }, el('div', { clase: 'ico' }, estiloCat(k).ico), el('span', {}, titulo(k))))))
    const top = masVendidos()
    partes.push(filaMomento())
    // Lo que ya compró en este celular (como "Volvé a comprar" de las tiendas grandes).
    const comprados = conHay(leer(CLAVE + '.comprados', []).map((id) => porId[id]))
    if (comprados.length >= 2) partes.push(seccion('🔁 Volvé a comprar', 'Lo que pediste antes', filaH(comprados.slice(0, 20))))
    if (top.length >= 4) partes.push(seccion('🔥 Lo más vendido', datos.sucursal ? 'Lo que más se lleva la gente en ' + nombreSucursal() + ' esta semana' : 'Lo que más se lleva la gente esta semana', filaH(top.slice(0, 20)), () => ir({ tipo: 'lista', top: true, titulo: 'Lo más vendido' })))
    if (combos.length) {
      const s = seccion('🎁 Combos', 'Más cosas, mejor precio', el('div', { clase: 'fila-combos' }, combos.slice(0, 10).map((c, i) => tarjetaCombo(c, i === 0))), combos.length > 2 ? () => ir({ tipo: 'lista', combos: true, titulo: 'Combos' }) : null)
      s.id = 'sec-combos'
      partes.push(s)
    }
    const ofertas = enPromo()
    if (ofertas.length) partes.push(seccion('💥 Ofertas', 'Promos vigentes · se aplican al cobrar', filaH(ofertas.slice(0, 20)), () => ir({ tipo: 'lista', promo: true, titulo: 'Ofertas' })))
    // Cuadros por categoria con la foto de lo que mas se vende ahi.
    const cuadros = cats.slice(0, 6).map((k) => {
      const l = conHay(productos.filter((p) => p.categoria === k))
      const conFoto = l.filter((p) => p.foto).sort((a, b) => (rankDe[a.id] || 999) - (rankDe[b.id] || 999))[0]
      const desc = Math.max(0, ...l.map((p) => (conPromo(p) || { off: 0 }).off))
      return el('button', { clase: 'cuadro', style: '--c:' + estiloCat(k).color, onclick: () => ir({ tipo: 'lista', categoria: k, titulo: titulo(k) }) },
        el('div', { clase: 'txt' }, el('b', {}, titulo(k)), el('span', {}, desc >= 5 ? 'Hasta ' + desc + '% OFF' : l.length + ' productos')),
        conFoto ? el('img', { src: conFoto.foto, alt: '', loading: 'lazy' }) : el('em', {}, estiloCat(k).ico))
    })
    if (cuadros.length >= 4) partes.push(seccion('🛒 Comprá por categoría', null, el('div', { clase: 'cuadros' }, cuadros)))
    const vistos = conHay(leer(CLAVE + '.vistos', []).map((id) => porId[id]))
    if (vistos.length >= 3) partes.push(seccion('👀 Visto recientemente', null, filaH(vistos)))
    const nv = nuevos()
    if (nv.length) partes.push(seccion('✨ Recién llegados', 'Lo nuevo que entró al local', filaH(nv.slice(0, 20)), nv.length > 4 ? () => ir({ tipo: 'lista', nuevos: true, titulo: 'Recién llegados' }) : null))
    // Una fila por cada una de las 4 categorias mas fuertes, como en las grandes tiendas.
    for (const k of cats.slice(0, 4)) {
      const l = conHay(productos.filter((p) => p.categoria === k)).sort((a, b) => (rankDe[a.id] || 999) - (rankDe[b.id] || 999) || !!b.foto - !!a.foto).slice(0, 14)
      if (l.length >= 3) partes.push(seccion(estiloCat(k).ico + ' ' + titulo(k), null, filaH(l), () => ir({ tipo: 'lista', categoria: k, titulo: titulo(k) })))
    }
    partes.push(seccion('Todos los productos', productos.length + ' productos', grilla(ordenar(productos, 'relevancia'))))
    partes.push(el('p', { clase: 'aviso' }, 'Precios de lista: pueden cambiar. Las promos se aplican al cobrar. Fotos ilustrativas.'))
    return partes
  }

  function ordenar (lista, orden) {
    const l = lista.slice()
    if (orden === 'menor') return l.sort((a, b) => precioDe(a) - precioDe(b))
    if (orden === 'mayor') return l.sort((a, b) => precioDe(b) - precioDe(a))
    if (orden === 'nombre') return l.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))
    // Relevancia: hay > mas vendido > con foto > promo > nombre.
    return l.sort((a, b) => (b.hay - a.hay) || ((rankDe[a.id] || 999) - (rankDe[b.id] || 999)) || (!!b.foto - !!a.foto) || (!!promoDe[b.id] - !!promoDe[a.id]) || a.nombre.localeCompare(b.nombre, 'es'))
  }

  function filtros (alCambiar) {
    const sel = el('select', { clase: 'chip', 'aria-label': 'Ordenar' }, [['relevancia', 'Más relevantes'], ['menor', 'Menor precio'], ['mayor', 'Mayor precio'], ['nombre', 'A-Z']].map(([v, tx]) => el('option', { value: v, selected: vista.orden === v }, tx)))
    sel.addEventListener('change', () => { vista.orden = sel.value; alCambiar() })
    const chip = (k, tx) => el('button', { clase: 'chip' + (vista[k] ? ' activo' : ''), onclick: () => { vista[k] = !vista[k]; alCambiar() } }, tx)
    return el('div', { clase: 'filtros' }, sel, chip('fPromo', '🔥 En promo'), chip('fFoto', '📷 Con foto'))
  }
  const aplicarFiltros = (l) => l.filter((p) => (!vista.fPromo || promoDe[p.id]) && (!vista.fFoto || p.foto))

  function pantallaLista () {
    const volver = el('div', { clase: 'miga' }, el('button', { 'aria-label': 'Volver', onclick: () => ir({ tipo: 'inicio' }) }, '←'), el('h2', {}, vista.titulo || 'Productos'))
    if (vista.combos) return [volver, el('div', { clase: 'combos' }, combos.map((c) => tarjetaCombo(c)))]
    let base
    if (vista.top) base = masVendidos()
    else if (vista.nuevos) base = nuevos()
    else if (vista.promo) base = enPromo()
    else base = productos.filter((p) => p.categoria === vista.categoria)
    // Subcategorias como chips (si las hay).
    let subs = []
    if (vista.categoria) subs = [...new Set(base.map((p) => p.subrubro).filter(Boolean))].sort()
    const caja = el('div', {})
    const repintar = () => {
      tarjetasVivas.clear()
      let l = aplicarFiltros(base.filter((p) => !vista.sub || p.subrubro === vista.sub))
      if (!vista.top || vista.orden) l = ordenar(l, vista.orden || 'relevancia')
      poner(caja, 
        subs.length > 1 ? el('div', { clase: 'filtros' }, ['', ...subs].map((s) => el('button', { clase: 'chip' + ((vista.sub || '') === s ? ' activo' : ''), onclick: () => { vista.sub = s; repintar() } }, s ? titulo(s) : 'Todo'))) : null,
        filtros(repintar),
        l.length ? grilla(l) : el('div', { clase: 'vacio' }, 'No hay productos con esos filtros.'))
    }
    repintar()
    return [volver, caja]
  }

  function pantallaBuscar () {
    const q = normal(vista.q).split(/\s+/).filter(Boolean)
    // Tolerante: si una palabra no aparece, prueba sin la ultima letra (plurales, tipeo).
    const coincide = (p, w) => p.busca.includes(w) || (w.length > 4 && p.busca.includes(w.slice(0, -1)))
    let l = productos.filter((p) => q.every((w) => coincide(p, w)))
    const combosQ = combos.filter((c) => q.every((w) => normal(c.nombre + ' ' + (c.partes || []).map((x) => x.nombre).join(' ')).includes(w)))
    const caja = el('div', {})
    const repintar = () => {
      tarjetasVivas.clear()
      const fl = ordenar(aplicarFiltros(l), vista.orden || 'relevancia')
      poner(caja, 
        filtros(repintar),
        combosQ.length ? el('div', { clase: 'combos', style: 'margin-bottom:12px' }, combosQ.slice(0, 4).map((c) => tarjetaCombo(c))) : null,
        fl.length ? grilla(fl) : el('div', { clase: 'vacio' }, combosQ.length ? '' : 'No encontramos "' + vista.q + '". Probá con otra palabra o mirá las categorías.'))
    }
    repintar()
    return [el('div', { clase: 'miga' }, el('button', { 'aria-label': 'Volver', onclick: () => { $('buscar').value = ''; ir({ tipo: 'inicio' }) } }, '←'), el('h2', {}, l.length + combosQ.length + ' resultados')), caja]
  }

  // ---------- Banner ----------
  let rotar = null
  function banners () {
    const caja = $('banner')
    if (!caja) return
    const slides = []
    const top = masVendidos()[0]
    for (const c of combos.slice(0, 3)) {
      slides.push(el('button', { clase: 'slide amarillo', onclick: () => abrirCombo(c) },
        el('div', { clase: 'txt' }, el('span', { clase: 'tag' }, 'Combo'), el('h2', {}, titulo(c.nombre)),
          el('div', { clase: 'grande' }, pesos(c.precio)),
          el('p', {}, c.separado ? 'Ahorrás ' + pesos(c.separado - c.precio) : (c.partes || []).map((x) => x.n + ' ' + titulo(x.nombre)).join(' + '))),
        ((fc) => fc.classList.contains('placa') ? null : fc)(fotoCombo(c))))
    }
    for (const pr of promos.slice(0, 3)) {
      const conFoto = (pr.ids || []).map((id) => porId[id]).find((p) => p && p.foto && p.hay)
      slides.push(el('button', { clase: 'slide rojo', onclick: () => pr.todo ? null : ir({ tipo: 'lista', promo: true, titulo: 'Ofertas' }) },
        el('div', { clase: 'txt' }, el('span', { clase: 'tag' }, pr.hasta === hoy() ? 'Solo por hoy' : 'Promo'), el('h2', {}, pr.etiqueta), el('p', {}, titulo(pr.nombre) + (pr.horas ? ' · de ' + pr.horas + ' h' : '') + (pr.hasta && pr.hasta !== hoy() ? ' · hasta el ' + pr.hasta.split('-').reverse().slice(0, 2).join('/') : ''))),
        pr.foto || conFoto ? el('img', { src: pr.foto || conFoto.foto, alt: '' }) : null))
    }
    if (top) {
      slides.push(el('button', { clase: 'slide', onclick: () => abrirFicha(top) },
        el('div', { clase: 'txt' }, el('span', { clase: 'tag' }, 'N.º 1 en ventas'), el('h2', {}, titulo(top.nombre)), el('div', { clase: 'grande' }, pesos(top.precio))),
        top.foto ? el('img', { src: top.foto, alt: '' }) : null))
    }
    // Envio gratis: el segundo cartel (despues de la mejor oferta).
    if (t().envioGratis) {
      slides.splice(Math.min(1, slides.length), 0, el('button', { clase: 'slide verde', onclick: () => ir({ tipo: 'lista', top: true, titulo: 'Lo más vendido' }) },
        el('div', { clase: 'txt' }, el('span', { clase: 'tag' }, 'Envío'), el('h2', {}, 'Envío gratis desde ' + pesos(t().envioGratis)),
          el('p', {}, (t().demora ? 'Te llega en ~' + t().demora + ' min. ' : '') + 'Sumá lo que te falta y no pagás el envío.')),
        el('em', { clase: 'grande-ico' }, '🚚')))
    }
    // La marca: el logo grande y lo que la hace distinta.
    const logo = el('img', { src: 'icono-512.png', alt: '' })
    const slideMarca = el('div', { clase: 'slide marca-slide' },
      el('div', { clase: 'txt' }, el('span', { clase: 'tag' }, 'Delivery'), el('h2', {}, nombreTienda()),
        el('p', {}, [t().demora ? 'Te lo llevamos en ~' + t().demora + ' min' : 'Pedí y te lo llevamos', t().horario].filter(Boolean).join(' · '))),
      logo)
    logo.addEventListener('error', () => logo.remove(), { once: true })
    slides.push(slideMarca)
    const riel = el('div', { clase: 'slides' }, slides)
    const puntos = el('div', { clase: 'puntitos' }, slides.map((_, i) => el('i', { clase: i ? '' : 'activo' })))
    poner(caja, riel, slides.length > 1 ? puntos : '')
    const actual = () => Math.round(riel.scrollLeft / (slides[0].offsetWidth + 12))
    riel.addEventListener('scroll', () => { const i = actual(); [...puntos.children].forEach((p, j) => p.classList.toggle('activo', i === j)) }, { passive: true })
    clearInterval(rotar)
    if (slides.length > 1) {
      rotar = setInterval(() => {
        if (!riel.isConnected) return clearInterval(rotar)
        if (document.hidden || $('hoja').classList.contains('abierta')) return
        const sig = (actual() + 1) % slides.length
        riel.scrollTo({ left: sig ? slides[sig].offsetLeft - riel.offsetLeft : 0, behavior: 'smooth' })
      }, 5000)
    }
  }

  // ---------- Hojas ----------
  function abrirHoja (tituloHoja, ...cuerpo) {
    tarjetasVivas.forEach((f) => { if (!f.nodo.isConnected) tarjetasVivas.delete(f) })
    $('hojaCaja').replaceChildren(
      el('div', { clase: 'hoja-cab' }, el('h2', {}, tituloHoja), el('button', { clase: 'cerrar', 'aria-label': 'Cerrar', onclick: cerrarHoja }, '✕')),
      el('div', { clase: 'hoja-cuerpo' }, ...cuerpo))
    $('hoja').classList.add('abierta')
    $('hojaCaja').scrollTop = 0
    document.body.style.overflow = 'hidden'
    document.body.classList.add('con-hoja')
    pintarPie()
  }
  function cerrarHoja () {
    $('hoja').classList.remove('abierta')
    document.body.style.overflow = ''
    document.body.classList.remove('con-hoja')
    pintarPie()
  }

  function compartir (texto, extra) {
    const url = location.origin + location.pathname + '#p=' + proyecto + '&s=' + sucursal + extra
    if (navigator.share) navigator.share({ title: nombreTienda(), text: texto, url }).catch(() => {})
    else window.open('https://wa.me/?text=' + encodeURIComponent(texto + ' ' + url))
  }

        rankDe[p.id] && rankDe[p.id] <= 10 ? el('div', { style: 'margin-top:6px' }, el('span', { clase: 'etq top' }, rankDe[p.id] === 1 ? 'N.º 1 más vendido' : 'Top ' + rankDe[p.id] + ' en ventas')) : null,
        bloquePrecio(p),
        promo ? el('div', { clase: 'promo-caja' }, '🔥 ' + promo.etiqueta + (promo.horas ? ' · de ' + promo.horas + ' h' : '') + ' · ' + titulo(promo.nombre)) : null,
        p.poco ? el('div', { clase: 'poco', style: 'color:#b54708;font-weight:700' }, '¡Quedan pocas unidades!') : null,
        ((n) => n && p.hay ? el('button', { clase: 'btn llevar', onclick: () => {
          const ya = cuantos(p.id)
          const obj = Math.min(99, (Math.floor(ya / n.lleva) + 1) * n.lleva)
          cambiar(p.id, obj - ya)
          toast('Llevás ' + obj + ': ' + (Math.floor(obj / n.lleva) * (n.lleva - n.paga)) + ' te sale' + (Math.floor(obj / n.lleva) * (n.lleva - n.paga) > 1 ? 'n' : '') + ' gratis')
        } }, '🔥 Llevá ' + n.lleva + ' y pagá ' + n.paga + ' · ' + pesos(n.unidad) + ' c/u') : null)(nxmDe(p)),
        el('div', { clase: 'botones' }, control(p.id, p.hay, true), el('button', { clase: 'btn', style: 'flex:0 0 auto', onclick: () => compartir(titulo(p.nombre) + ' a ' + pesos(p.precio), '&prod=' + encodeURIComponent(p.id)) }, 'Compartir')),
        cmb.length ? seccion('Llevalo en combo', null, el('div', { clase: 'combos' }, cmb.slice(0, 3).map((c) => tarjetaCombo(c)))) : null,
        otros.length ? seccion('Quienes lo compran también llevan', null, filaH(otros)) : null,
        parecidos.length ? seccion('También te puede gustar', null, filaH(parecidos)) : null))
  }

  function abrirCombo (c) {
    abrirHoja('Combo',
      el('div', { clase: 'ficha' },
        el('div', { clase: 'ficha-foto' }, fotoCombo(c)),

        c.separado ? el('div', { clase: 'tachado', style: 'text-decoration:line-through;color:var(--tenue);margin-top:6px' }, 'Por separado ' + pesos(c.separado)) : null,
        el('div', { clase: 'precio' }, pesos(c.precio)),
