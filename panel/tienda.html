        c.horas ? el('div', { clase: 'meta', style: 'margin-top:6px' }, 'Vale de ' + c.horas + ' h') : null,
        el('div', { clase: 'botones' }, control('combo:' + c.id, true, true), el('button', { clase: 'btn', style: 'flex:0 0 auto', onclick: () => compartir('Combo ' + titulo(c.nombre) + ' a ' + pesos(c.precio), '&combo=' + encodeURIComponent(c.id)) }, 'Compartir')),
        el('p', { clase: 'meta' }, 'Lleva:'),
        (c.partes || []).map((x) => {
          const fijos = x.ids.map((id) => porId[id]).filter(Boolean)
          return el('div', { clase: 'linea' },
            el('div', { clase: 'mini' }, fijos[0] ? foto(fijos[0]) : placa(x.nombre, x.nombre)),
            el('div', { clase: 'info' }, el('div', {}, x.n + ' × ' + titulo(x.nombre)), fijos.length > 1 ? el('div', { clase: 'sub' }, 'Elegís en el local entre ' + fijos.length + ' opciones') : null))
        })))
  }

  // ---------- Ultimo pedido ----------
  function ultimoPedido () {
    const u = leer(CLAVE + '.ultimo', null)
    if (!u || !u.items) return null
    const vivos = Object.keys(u.items).filter(disponible)
    if (!vivos.length) return null
    const nombres = vivos.map((k) => { const c = comboDe(k); return titulo(c ? c.nombre : porId[k].nombre) })
    return { vivos, items: u.items, texto: nombres.slice(0, 3).join(', ') + (nombres.length > 3 ? ' y ' + (nombres.length - 3) + ' más' : '') }
  }
  function repetir () {
    const u = ultimoPedido()
    if (!u) return
    for (const k of u.vivos) carrito[k] = Math.max(cuantos(k), u.items[k])
    guardar(CLAVE + '.carrito', carrito)
    pintar()
    pintarPie()
    abrirCarrito()
  }

  // ---------- Para este momento ----------
  // Segun la hora (y si es finde), una fila con lo que mas se vende para ese momento.
  const MOMENTOS = {
    desayuno: { titulo: '☀️ Para el desayuno', sub: 'Arrancá el día con todo', re: /lacte|leche|yogur|panader|\bpan\b|factura|galletit|budin|bizcoch|infusion|yerba|cafe|mate\b|cereal|jugo|tostad|mermelad|dulce de leche|manteca/ },
    almuerzo: { titulo: '🍝 Para el almuerzo', sub: 'Lo que falta para la mesa', re: /pasta|fideo|arroz|aderez|mayones|ketchup|pure\b|salsa|tomate|aceite|\bpan\b|fiambre|queso|gaseos|agua\b|soda|vino/ },
    merienda: { titulo: '🧉 Para la merienda', sub: 'Algo rico para acompañar', re: /galletit|alfajor|budin|bizcoch|lacte|leche|yerba|mate\b|infusion|chocolat|panader|factura|oblea/ },
    previa: { titulo: '🍻 Armá la previa', sub: 'Bebidas, hielo y algo para picar', re: /cerveza|fernet|vino|aperitiv|vodka|whisk|\bgin\b|trago|gaseos|energiz|snack|papas|palito|chizito|mani\b|hielo/ },
    noche: { titulo: '🌙 Antojo de noche', sub: 'Para la peli o para darte un gusto', re: /helad|golosin|chocolat|alfajor|snack|papas|gaseos|cerveza|chicle|caramel|turron|bombon/ }
  }
  function momentoAhora () {
    const d = new Date()
    const h = d.getHours()
    if (h >= 6 && h < 11) return 'desayuno'
    if (h >= 11 && h < 15) return 'almuerzo'
    if (h >= 15 && h < 19) return 'merienda'
    // Jueves a sabado a la noche (y la madrugada siguiente): previa.
    return (h >= 19 ? [4, 5, 6] : [5, 6, 0]).includes(d.getDay()) ? 'previa' : 'noche'
  }
  function filaMomento () {
    const m = MOMENTOS[momentoAhora()]
    const l = conHay(productos.filter((p) => m.re.test(normal(p.categoria + ' ' + p.subrubro + ' ' + p.nombre))))
      .sort((a, b) => ((rankDe[a.id] || 999) - (rankDe[b.id] || 999)) || (!!b.foto - !!a.foto) || (!!promoDe[b.id] - !!promoDe[a.id]))
    return l.length >= 6 ? seccion(m.titulo, m.sub, filaH(l.slice(0, 20))) : null
  }

  // Lo que mas se busca: la marca (o la palabra que la nombra) de los mas vendidos.
  const GENERICAS = /^(gaseosa|cerveza|energizante|vino|agua|jugo|alfajor|chocolate|galletitas?|galleta|pan|caramelos?|chupaleta|chicle|helado|snacks?|papas|aperitivo|leche|yogur|oblea|tableta|bebida|lata|laton|botella|caja|pack|sabor|original|de|la|el|con)$/
  function busquedasPopulares () {
    const out = []
    for (const p of masVendidos()) {
      const w = titulo(p.marca || p.nombre.split(/\s+/).find((x) => x.length > 2 && !/\d/.test(x) && !GENERICAS.test(normal(x))) || '')
      if (w && !out.some((o) => normal(o) === normal(w))) out.push(w)
      if (out.length >= 8) break
    }
    return out
  }

  // ---------- Armar combo desde el pedido ----------
  // Si el pedido ya tiene todo un combo menos una parte, se ofrece completarlo:
  // lo que ya eligio pasa al combo y su eleccion (el sabor) va en la nota.
  function comboArmable () {
    let mejor = null
    for (const c of combos) {
      const partes = c.partes || []
      if (partes.length < 2 || c.horas) continue
      const tiene = (x) => (x.ids || []).reduce((s, id) => s + (porId[id] ? cuantos(id) : 0), 0)
      const faltan = partes.filter((x) => tiene(x) < x.n)
      if (faltan.length !== 1) continue
      const f = faltan[0]
      if (tiene(f) || !(f.ids || []).some((id) => porId[id] && porId[id].hay)) continue
      const ahorro = (c.separado || 0) - c.precio
      if (!mejor || ahorro > mejor.ahorro) mejor = { combo: c, falta: f, ahorro }
    }
    return mejor
  }
  function armarCombo (a) {
    const eleg = leer(CLAVE + '.elegidos', {})
    const nombres = []
    for (const x of a.combo.partes) {
      if (x === a.falta) continue
      let resta = x.n
      for (const id of x.ids.filter((i) => cuantos(i)).sort((i, j) => cuantos(j) - cuantos(i))) {
        if (!resta) break
        const usa = Math.min(resta, cuantos(id))
        if (x.ids.length > 1) nombres.push(usa + ' ' + titulo(porId[id].nombre))
        cambiar(id, -usa)
        resta -= usa
      }
    }
    cambiar('combo:' + a.combo.id, 1)
    if (nombres.length) { eleg[a.combo.id] = [...(eleg[a.combo.id] || []), ...nombres].slice(-6); guardar(CLAVE + '.elegidos', eleg) }
    toast('¡Listo! Armaste el ' + titulo(a.combo.nombre))
  }
  // Lo que eligio para los combos armados, para la nota del pedido.
  function notaCombos () {
    const eleg = leer(CLAVE + '.elegidos', {})
    return Object.entries(eleg).filter(([id]) => comboDe('combo:' + id) && cuantos('combo:' + id)).map(([id, l]) => titulo(comboDe('combo:' + id).nombre) + ' con ' + l.join(', ')).join('; ')
  }

  // ---------- Pedido ----------
  function abrirCarrito () {
    if (!lineas().length) return toast('Tu pedido está vacío: tocá "+ Agregar" en lo que quieras.')
    const cuerpo = el('div', {})
    const nombre = el('input', { type: 'text', maxlength: '60', placeholder: 'Tu nombre', autocomplete: 'name', value: cliente.nombre })
    const telefono = el('input', { type: 'tel', maxlength: '20', placeholder: 'Ej: 351 555-1234', autocomplete: 'tel', value: cliente.telefono || '' })
    const direccion = el('input', { type: 'text', maxlength: '120', placeholder: 'Calle, número, piso, entre calles', autocomplete: 'street-address', value: cliente.direccion })
    const vuelto = el('input', { type: 'number', min: '0', step: '100', inputmode: 'numeric', placeholder: 'Ej: 20000' })
    const nota = el('textarea', { rows: '2', maxlength: '150', placeholder: 'Algo más: timbre, marca que preferís, etc. (opcional)' })
    const mayor = el('input', { type: 'checkbox' })
    const error = el('div', { clase: 'error' })
    const zona = el('div', {})
    const boton = el('button', { clase: 'btn whatsapp ancho-total' })

    const pintarZona = () => {
      const l = lineas()
      if (!l.length) { cerrarHoja(); pintar(); return }
      const sub = subtotal()
      const envio = cliente.entrega === 'envio'
      const costo = envio ? costoEnvio(sub) : 0
      const falta = t().envioGratis && sub < t().envioGratis ? t().envioGratis - sub : 0
      const minimo = envio && t().envioMinimo && sub < t().envioMinimo ? t().envioMinimo - sub : 0
      const hayAlcohol = l.some((x) => x.p && esAlcohol(x.p))
      // Sugerencias: lo que se compra junto con lo que ya lleva; si no, los mas vendidos.
      const ya = new Set(l.map((x) => x.k))
      const suger = []
      for (const x of l) for (const id of (datos.juntos && datos.juntos[x.k]) || []) if (!ya.has(id) && porId[id] && porId[id].hay && !suger.includes(porId[id])) suger.push(porId[id])
      for (const p of masVendidos()) if (suger.length < 8 && !ya.has(p.id) && !suger.includes(p)) suger.push(p)
      // Envio gratis: lo que mas se vende y alcanza para llegar (lo mas barato primero).
      // Solo si falta poco (hasta un tercio): si falta mucho, un producto caro no es la respuesta.
      const llegan = envio && falta && falta <= t().envioGratis / 3 ? conHay([...suger, ...masVendidos()].filter((p, i, a) => a.indexOf(p) === i && !ya.has(p.id) && precioDe(p) >= falta)).sort((a, b) => precioDe(a) - precioDe(b)).slice(0, 8) : []
      const armable = comboArmable()
      const filaQueSuma = (lista) => el('div', { clase: 'fila-h' }, lista.map((p) => { const n = tarjeta(p); n.addEventListener('click', (ev) => { if (ev.target.closest('.acciones')) setTimeout(pintarZona, 0) }, true); return n }))
      const ahorro = ahorroPromos()
      tarjetasVivas.forEach((f) => { if (!f.nodo.isConnected) tarjetasVivas.delete(f) })
      poner(zona,
        ...l.map((x) => {
          const n = x.p && nxmDe(x.p)
          const faltan = n ? (n.lleva - x.c % n.lleva) % n.lleva : 0
          const gratis = n ? n.lleva - n.paga : 0
          return el('div', { clase: 'linea' },
            el('div', { clase: 'mini' }, x.p ? foto(x.p) : (x.combo ? fotoCombo(x.combo) : placa(x.nombre, 'combo'))),
            el('div', { clase: 'info' }, el('div', {}, (x.combo ? '🎁 ' : '') + titulo(x.nombre)), el('div', { clase: 'sub' }, x.lista && x.lista > x.precio ? el('s', {}, pesos(x.lista)) : null, (x.lista > x.precio ? ' ' : '') + pesos(x.precio) + ' c/u' + (x.p && promoDe[x.k] ? ' · ' + promoDe[x.k].etiqueta : '')),
              ahorroLinea(x) ? el('div', { clase: 'gana' }, '✓ ' + Math.floor(x.c / n.lleva) * gratis + ' gratis por el ' + promoDe[x.k].etiqueta) : null,
              faltan && faltan <= Math.max(2, Math.floor(n.lleva / 2)) ? el('button', { clase: 'empujon', onclick: () => { cambiar(x.k, faltan); pintarZona() } }, 'Sumá ' + faltan + ' y ' + (gratis > 1 ? gratis + ' te salen gratis' : '1 te sale gratis')) : null),
            el('div', { clase: 'paso' },
              el('button', { 'aria-label': 'Uno menos', onclick: () => { cambiar(x.k, -1); pintarZona() } }, '−'),
              el('b', {}, x.c),
              el('button', { 'aria-label': 'Uno más', onclick: () => { cambiar(x.k, 1); pintarZona() } }, '+')))
        }),
        armable ? el('div', { clase: 'armar' },
          el('div', { clase: 'txt' }, el('b', {}, '🎁 Con ' + armable.falta.n + ' ' + titulo(armable.falta.nombre) + ' armás el ' + titulo(armable.combo.nombre)),
            el('span', {}, 'Todo junto ' + pesos(armable.combo.precio) + (armable.combo.separado ? ' · ahorrás ' + pesos(armable.combo.separado - armable.combo.precio) : ''))),
          el('button', { clase: 'btn amarillo', onclick: () => { armarCombo(armable); pintarZona() } }, 'Armar combo')) : null,
        envio && t().envioGratis ? el('div', { clase: 'barra-envio' }, falta ? '🚚 Te faltan ' + pesos(falta) + ' para el envío gratis' : '🎉 ¡Tenés envío gratis!', el('div', { clase: 'riel' }, el('i', { style: 'width:' + Math.min(100, Math.round(sub * 100 / t().envioGratis)) + '%' }))) : null,
        llegan.length ? seccion('🚚 Con esto llegás al envío gratis', null, filaQueSuma(llegan)) : null,
        suger.length && !llegan.length ? seccion('¿Te sumamos algo?', null, filaQueSuma(suger.slice(0, 8))) : null,
        el('div', { clase: 'cuentas' },
          el('div', {}, el('span', {}, 'Productos'), el('span', {}, pesos(sub + ahorro))),
          ahorro ? el('div', { clase: 'verde' }, el('span', {}, 'Promos'), el('span', {}, '− ' + pesos(ahorro))) : null,
          envio ? el('div', {}, el('span', {}, 'Envío'), el('span', {}, costo ? pesos(costo) : 'Gratis')) : null,
          el('div', { clase: 'tot' }, el('span', {}, 'Total aproximado'), el('span', {}, pesos(sub + costo)))),
        minimo ? el('div', { clase: 'error' }, 'Para envío a domicilio el mínimo es ' + pesos(t().envioMinimo) + ': te faltan ' + pesos(minimo) + '. También podés retirarlo.') : null,
        hayAlcohol ? el('label', { clase: 'mayor' }, mayor, 'Soy mayor de 18 años (tu pedido tiene bebidas con alcohol)') : null)
      boton.disabled = !!minimo
      boton.style.opacity = minimo ? '.5' : ''
    }

    const seg = (opciones, clave, alCambiar) => {
      const n = el('div', { clase: 'seg' })
      const p = () => n.replaceChildren(...opciones.map(([k, tx]) => el('button', { clase: cliente[clave] === k ? 'activo' : '', onclick: () => { cliente[clave] = k; guardar(CLAVE + '.cliente', cliente); p(); alCambiar && alCambiar() } }, tx)))
      p()
      return n
    }
    const campoDir = el('div', { clase: 'campo' }, el('label', {}, 'Dirección de envío'), direccion)
    const campoVuelto = el('div', { clase: 'campo' }, el('label', {}, '¿Con cuánto pagás? (para llevarte el vuelto)'), vuelto)
    const alEntrega = () => { campoDir.hidden = cliente.entrega !== 'envio'; pintarZona() }
    const alPago = () => { campoVuelto.hidden = cliente.pago !== 'efectivo' || cliente.entrega !== 'envio' }

    const textoWhatsApp = (yaMandado) => {
      const tx = ['Hola! Quiero hacer este pedido' + (datos.sucursal ? ' (' + datos.sucursal + ')' : '') + (yaMandado ? ' (ya lo mandé por la tienda)' : '') + ':', '']
      for (const x of lineas()) tx.push(x.c + ' x ' + (x.combo ? 'COMBO ' : '') + x.nombre + ' — ' + pesos(x.precio * x.c))
      const sub = subtotal()
      const costo = cliente.entrega === 'envio' ? costoEnvio(sub) : 0
      tx.push('', 'Total aproximado: ' + pesos(sub + costo) + (costo ? ' (con envío)' : ''), 'Nombre: ' + cliente.nombre)
      tx.push(cliente.entrega === 'envio' ? 'Envío a: ' + cliente.direccion : 'Lo retiro en el local')
      tx.push('Pago: ' + ({ efectivo: 'efectivo', transferencia: 'transferencia', mp: 'Mercado Pago' }[cliente.pago] || 'efectivo') + (vuelto.value ? ' (pago con ' + pesos(Number(vuelto.value) * 100) + ')' : ''))
      if (notaCombos()) tx.push('Combos: ' + notaCombos())
      if (nota.value.trim()) tx.push('Nota: ' + nota.value.trim())
      return 'https://wa.me/' + datos.whatsapp + '?text=' + encodeURIComponent(tx.join('\n'))
    }
    // Directo a la caja. Devuelve 'ok' o por que no entro.
    const mandarDirecto = async () => {
      let pid = leer(CLAVE + '.enviando', '')
      const huella = JSON.stringify([lineas().map((x) => [x.k, x.c]), cliente, nota.value.trim(), vuelto.value])
      if (!pid || leer(CLAVE + '.huella', '') !== huella) {
        pid = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16))
        guardar(CLAVE + '.enviando', pid)
        guardar(CLAVE + '.huella', huella)
      }
      const sub = subtotal()
      const envio = cliente.entrega === 'envio'
      const pedidoNube = {
        items: lineas().map((x) => ({ id: x.combo ? 'combo:' + x.combo.id : (x.k.startsWith('n:') ? null : x.k), n: x.nombre, c: x.c })),
        nombre: cliente.nombre,
        telefono: cliente.telefono,
        entrega: envio ? 'envio' : 'retira',
        direccion: envio ? cliente.direccion : '',
        pago: cliente.pago,
        vuelto: envio && cliente.pago === 'efectivo' && Number(vuelto.value) > 0 ? Math.round(Number(vuelto.value) * 100) : undefined,
        nota: [nota.value.trim(), notaCombos()].filter(Boolean).join(' · '),
        envio: envio ? costoEnvio(sub) : 0,
        total: sub + (envio ? costoEnvio(sub) : 0)
      }
      try {
        const r = await fetch('https://' + proyecto + '.supabase.co/rest/v1/rpc/pos_tienda_pedido', {
          method: 'POST',
          headers: { apikey: datos.clave, Authorization: 'Bearer ' + datos.clave, 'Content-Type': 'application/json' },
          body: JSON.stringify({ pid, suc: sucursal, pedido: pedidoNube })
        })
        if (!r.ok) return 'error'
        return String(await r.json())
      } catch (e) { return 'sin-internet' }
    }
    const listo = () => {
      const porWhatsApp = datos.whatsapp ? textoWhatsApp(true) : ''
      guardar(CLAVE + '.ultimo', { items: Object.assign({}, carrito), en: Date.now() })
      anotar('.comprados', Object.keys(carrito).filter((k) => porId[k]), 30)
      carrito = {}
      guardar(CLAVE + '.carrito', carrito)
      guardar(CLAVE + '.enviando', '')
      guardar(CLAVE + '.elegidos', {})
      pintar()
      abrirHoja('¡Pedido enviado!',
        el('div', { style: 'text-align:center;font-size:56px;margin:10px 0' }, '🎉'),
        el('h3', { style: 'text-align:center;margin:0 0 8px' }, '¡Listo, ' + cliente.nombre.split(' ')[0] + '! Tu pedido llegó al local'),
        el('p', { style: 'text-align:center' }, 'Te escribimos al ' + cliente.telefono + ' para confirmarte el total' + (cliente.entrega === 'envio' ? ' y el envío' + (t().demora ? ' (llega en ~' + t().demora + ' min)' : '') + '.' : ' y cuándo pasar a buscarlo.')),
        datos.puntos ? el('p', { clase: 'aviso' }, '⭐ Con tu teléfono sumás puntos cuando lo pagás.') : null,
        porWhatsApp ? el('a', { clase: 'btn whatsapp ancho-total', href: porWhatsApp, style: 'display:block;text-align:center;text-decoration:none;margin-top:12px' }, 'Avisar también por WhatsApp') : null,
        el('button', { clase: 'btn ancho-total', style: 'margin-top:10px', onclick: cerrarHoja }, 'Volver a la tienda'))
    }
    const enviar = async () => {
      if (enviando) return
      error.textContent = ''
      cliente.nombre = nombre.value.trim()
      cliente.telefono = telefono.value.trim()
      cliente.direccion = direccion.value.trim()
      guardar(CLAVE + '.cliente', cliente)
      const pedir = (campo, txt) => { error.textContent = txt; campo.focus(); campo.scrollIntoView({ block: 'center', behavior: 'smooth' }) }
      if (!cliente.nombre) return pedir(nombre, 'Poné tu nombre.')
      if (datos.pedidos && cliente.telefono.replace(/\D/g, '').length < 8) return pedir(telefono, 'Poné tu teléfono con la característica, así te confirmamos.')
      if (cliente.entrega === 'envio' && !cliente.direccion) return pedir(direccion, 'Poné la dirección de envío.')
      if (lineas().some((x) => x.p && esAlcohol(x.p)) && !mayor.checked) return pedir(mayor, 'Las bebidas con alcohol son solo para mayores de 18.')
      if (datos.pedidos && datos.clave) {
        enviando = true
        boton.disabled = true
        boton.textContent = 'Mandando…'
        const r = await mandarDirecto()
        enviando = false
        boton.disabled = false
        boton.textContent = textoBoton
        if (r === 'ok') return listo()
        if (!datos.whatsapp) { error.textContent = r === 'muchos' ? 'Hay muchos pedidos en este momento: probá de nuevo en unos minutos.' : r === 'cerrada' ? 'La tienda no está tomando pedidos ahora.' : 'No se pudo mandar el pedido. Revisá la conexión y probá de nuevo.'; return }
      }
      if (!datos.whatsapp) { error.textContent = 'Esta tienda todavía no tiene WhatsApp para recibir pedidos.'; return }
      location.href = textoWhatsApp(false)
    }
    const textoBoton = datos.pedidos ? 'Enviar pedido' : 'Enviar pedido por WhatsApp'
    boton.textContent = textoBoton
    boton.addEventListener('click', enviar)

    cuerpo.append(
      zona,
      el('div', { clase: 'campo' }, el('label', {}, '¿Cómo lo recibís?'), seg([['envio', '🚚 Envío'], ['retiro', '🏪 Retiro en el local']], 'entrega', () => { alEntrega(); alPago() })),
      campoDir,
      el('div', { clase: 'campo' }, el('label', {}, 'Nombre'), nombre),
      datos.pedidos ? el('div', { clase: 'campo' }, el('label', {}, 'Tu WhatsApp (para confirmarte el pedido)'), telefono) : null,
      el('div', { clase: 'campo' }, el('label', {}, '¿Cómo pagás?'), seg([['efectivo', '💵 Efectivo'], ['transferencia', '🏦 Transferencia'], ['mp', '📱 Mercado Pago']], 'pago', alPago)),
      campoVuelto,
      el('div', { clase: 'campo' }, nota),
      error,
      boton,
      el('p', { clase: 'aviso' }, datos.pedidos
        ? 'El pedido llega directo al local y te escriben para confirmarte el total. Pagás al recibirlo.'
        : 'Se abre WhatsApp con el pedido escrito: solo tenés que apretar enviar.'))
    if (!cliente.pago) cliente.pago = 'efectivo'
    abrirHoja('Tu pedido', cuerpo)
    alEntrega()
    alPago()
  }

  // ---------- Avisos ----------
  let toastT = null
  function toast (txt) {
    let n = document.querySelector('.toast')
    if (!n) { n = el('div', { clase: 'toast', role: 'status' }); document.body.append(n) }
    n.textContent = txt
    clearTimeout(toastT)
    toastT = setTimeout(() => n.remove(), 1800)
  }

  // ---------- Eventos ----------
  let buscarT = null
  $('buscar').addEventListener('input', () => {
    clearTimeout(buscarT)
    buscarT = setTimeout(() => {
      const q = $('buscar').value.trim()
      if (q) { vista = { tipo: 'buscar', q, orden: vista.tipo === 'buscar' ? vista.orden : '' }; pintar() } else if (vista.tipo === 'buscar') ir({ tipo: 'inicio' })
    }, 180)
  })
  $('buscar').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') $('buscar').blur() })
  // Al tocar el buscador vacio: lo mas buscado, para elegir de un toque.
  const mostrarSugeridas = () => {
    const l = datos && !$('buscar').value.trim() ? busquedasPopulares() : []
    $('sugeridas').hidden = !l.length
    if (!l.length) return
    $('sugeridasTxt').replaceChildren(el('span', {}, '🔥 Lo más buscado'), ...l.map((w) => el('button', { clase: 'chip', onmousedown: (ev) => ev.preventDefault(), onclick: () => {
      $('buscar').value = w
      $('sugeridas').hidden = true
      vista = { tipo: 'buscar', q: w, orden: '' }
      pintar()
      $('buscar').blur()
    } }, w)))
  }
  $('buscar').addEventListener('focus', mostrarSugeridas)
  $('buscar').addEventListener('input', () => { if ($('buscar').value.trim()) $('sugeridas').hidden = true; else mostrarSugeridas() })
  $('buscar').addEventListener('blur', () => setTimeout(() => { $('sugeridas').hidden = true }, 150))
  $('carritoBtn').addEventListener('click', abrirCarrito)
  $('pieBtn').addEventListener('click', abrirCarrito)
  $('hoja').addEventListener('click', (ev) => { if (ev.target === $('hoja')) cerrarHoja() })
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('hoja').classList.contains('abierta')) cerrarHoja() })
  cargar()
})()
</script>
</body>
</html>
